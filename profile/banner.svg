<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="160" viewBox="0 0 1280 160">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#020810"/>
      <stop offset="50%"  stop-color="#030d1c"/>
      <stop offset="100%" stop-color="#020810"/>
    </linearGradient>
    <linearGradient id="line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#020810" stop-opacity="0"/>
      <stop offset="30%"  stop-color="#1d4ed8" stop-opacity="0.6"/>
      <stop offset="70%"  stop-color="#1d4ed8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#020810" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .title {
        font-family: 'Courier New', Courier, monospace;
        font-size: 44px;
        font-weight: 700;
        letter-spacing: 10px;
        fill: url(#titleGrad);
        filter: url(#glow);
        animation: fadeIn 1.4s ease forwards;
        opacity: 0;
      }
      .prefix {
        font-family: 'Courier New', Courier, monospace;
        font-size: 16px;
        fill: #1d4ed8;
        letter-spacing: 2px;
        animation: fadeIn 1s ease forwards;
        opacity: 0;
      }
      .desc {
        font-family: 'Courier New', Courier, monospace;
        font-size: 13px;
        fill: #1e40af;
        letter-spacing: 4px;
        animation: fadeIn 1.8s ease forwards;
        opacity: 0;
      }
      .cursor {
        fill: #3b82f6;
        animation: blink 1.1s step-end infinite;
      }
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(6px); }
        to   { opacity: 1; transform: translateY(0);   }
      }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50%      { opacity: 0; }
      }
    </style>
  </defs>

  <!-- background -->
  <rect width="1280" height="160" fill="url(#bg)"/>

  <!-- top accent line -->
  <rect x="0" y="0" width="1280" height="1" fill="url(#line)"/>
  <!-- bottom accent line -->
  <rect x="0" y="159" width="1280" height="1" fill="url(#line)"/>

  <!-- subtle horizontal mid-line -->
  <rect x="0" y="80" width="1280" height="1" fill="#0f2a50" opacity="0.4"/>

  <!-- // prefix -->
  <text x="640" y="58" text-anchor="middle" class="prefix">// essential-devs</text>

  <!-- main title -->
  <text x="640" y="108" text-anchor="middle" class="title">ESSENTIAL DEVS</text>

  <!-- blinking cursor after title -->
  <rect x="890" y="82" width="3" height="30" rx="1" class="cursor"/>

  <!-- subtitle -->
  <text x="640" y="138" text-anchor="middle" class="desc">QUITEN RESEARCH &amp; INFRASTRUCTURE LABS</text>
</svg>
